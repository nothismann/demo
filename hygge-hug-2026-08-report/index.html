<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HYGGE HUG｜2026 年 8 月成效月報</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f1e9;color:#211d1a;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.loading{text-align:center}.loading b{display:block;font-size:22px;margin-bottom:8px}.loading span{color:#6f6862;font-size:14px}</style>
</head>
<body>
<div class="loading"><b>HYGGE HUG</b><span>8 月成效月報載入中…</span></div>
<script>
(async()=>{
  try{
    const files=['report.part1.txt','report.part2.txt','report.part3.txt'];
    const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('瀏覽器不支援解壓縮');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><b>頁面載入失敗</b><span>請重新整理，或改用最新版 Chrome、Edge、Safari 開啟。</span></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
