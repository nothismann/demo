name: Build HYGGE HUG report

on:
  push:
    branches: [main]
    paths:
      - 'hygge-hug-2026-08-report/report.part*.txt'
      - '.github/workflows/build-hygge-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          cd hygge-hug-2026-08-report
          cat report.part1.txt report.part2.txt report.part3.txt | tr -d '\r\n\t ' > report.b64
          base64 -d report.b64 > report.gz
          gzip -dc report.gz > index.html
          rm -f report.b64 report.gz
          test "$(head -c 15 index.html)" = '<!doctype html>'
          grep -q 'HYGGE HUG' index.html
      - name: Commit rebuilt page
        shell: bash
        run: |
          if git diff --quiet -- hygge-hug-2026-08-report/index.html; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hygge-hug-2026-08-report/index.html
          git commit -m 'Rebuild HYGGE HUG August report page'
          git push
