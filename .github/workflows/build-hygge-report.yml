name: Build HYGGE HUG report

on:
  push:
    branches: [main]
    paths:
      - 'hygge-hug-2026-08-report/BUILD_NOW'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          cd hygge-hug-2026-08-report
          cat page.part01.txt page.part02.txt page.part03.txt page.part04.txt > index.html
          test "$(head -c 15 index.html)" = '<!doctype html>'
          grep -q 'HYGGE HUG' index.html
          grep -q '</body></html>' index.html
      - name: Commit rebuilt page
        shell: bash
        run: |
          if git diff --quiet -- hygge-hug-2026-08-report/index.html; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hygge-hug-2026-08-report/index.html
          git commit -m 'Publish HYGGE HUG August report'
          git push
